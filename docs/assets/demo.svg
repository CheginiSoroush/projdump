<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="projdump terminal session demo">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101916"/>
      <stop offset="1" stop-color="#0d1411"/>
    </linearGradient>
    <filter id="tShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="880" height="470" rx="0" fill="none"/>
  <g filter="url(#tShadow)">
    <rect x="10" y="10" width="860" height="450" rx="16" fill="url(#tBg)" stroke="#1d2a24"/>
    <rect x="10" y="10" width="860" height="46" rx="16" fill="#121c18"/>
    <rect x="10" y="42" width="860" height="14" fill="#121c18"/>
    <circle cx="40" cy="33" r="7" fill="#ff5f57"/>
    <circle cx="64" cy="33" r="7" fill="#febc2e"/>
    <circle cx="88" cy="33" r="7" fill="#28c840"/>
    <text x="440" y="39" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14" fill="#5f7268" text-anchor="middle">bash — demo</text>
  </g>

  <g font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="17">
    <!-- line 1 -->
    <text x="42" y="100" fill="#34d399" font-weight="bold">$</text>
    <text x="66" y="100" fill="#e7f1eb" opacity="0">projdump --list
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.5s" fill="freeze"/>
    </text>
    <!-- line 2 -->
    <text x="42" y="140" fill="#5f7268" opacity="0">  src/auth.py        8.2 KB    312 lines   ~2,400 tokens
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.1s" fill="freeze"/>
    </text>
    <text x="42" y="170" fill="#5f7268" opacity="0">  src/api.py        12.4 KB    486 lines   ~3,700 tokens
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.4s" fill="freeze"/>
    </text>
    <text x="42" y="200" fill="#5f7268" opacity="0">  … +126 more files
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.7s" fill="freeze"/>
    </text>
    <text x="42" y="230" fill="#34d399" opacity="0">  ✓ 128 files · 4,213 lines · 96.4 KB · ~12,000 tokens
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.1s" fill="freeze"/>
    </text>
    <!-- line 3 -->
    <text x="42" y="286" fill="#34d399" font-weight="bold">$</text>
    <text x="66" y="286" fill="#e7f1eb" opacity="0">projdump --since HEAD~3 --format xml
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.8s" fill="freeze"/>
    </text>
    <text x="42" y="326" fill="#34d399" opacity="0">  ✓ 17 changed files → my-project_dump.xml
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.5s" fill="freeze"/>
    </text>
    <!-- line 4 -->
    <text x="42" y="382" fill="#34d399" font-weight="bold">$</text>
    <text x="66" y="382" fill="#e7f1eb" opacity="0">projdump --tokens-budget 60000 --sort size-desc
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="4.2s" fill="freeze"/>
    </text>
    <text x="42" y="422" fill="#34d399" opacity="0">  ✓ 42 files within budget (12,881 / 60,000 tokens)
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="4.9s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking caret -->
  <rect x="66" y="440" width="11" height="20" fill="#34d399">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
