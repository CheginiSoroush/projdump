name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source tarball
        run: |
          # write outside the tree: tarring "." while the tarball grows in it
          # triggers "file changed as we read it"
          tar --exclude='.git' -czf "${RUNNER_TEMP}/projdump-${GITHUB_REF_NAME}.tar.gz" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/projdump-*.tar.gz

